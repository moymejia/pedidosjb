<h4 class="card-title m-b-5 header-titulo">Liquidacion de ingresos</h4>
<form class="margen-formulario" id="formulario_liquidacion_de_ingresos">

    <input type="hidden" id="jsid" name="jsid" value="liquidacion_de_ingresos">

    <div class="row">
        <div class="form-group m-b-5 col-md-3">
            <label for="fecha_desde">Fecha desde</label>
            <input type="date" class="form-control" id="fecha_desde" name="fecha_desde" required>
            <span class="bar"></span>
        </div>

        <div class="form-group m-b-5 col-md-3">
            <label for="fecha_hasta">Fecha hasta</label>
            <input type="date" class="form-control" id="fecha_hasta" name="fecha_hasta" required>
            <span class="bar"></span>
        </div>

        <div class="form-group col-md-6 m-t-10">
            <br>
            <button
                type="button"
                id="generar_liquidacion"
                class="btn btn-success waves-effect waves-light m-r-10"
                onclick="generar_reporte_liquidacion_de_ingresos();"
            >Generar reporte</button>

            <button
                type="reset"
                class="btn btn-inverse waves-effect waves-light m-r-10"
                onclick="limpiar_reporte_liquidacion_de_ingresos();"
            >Limpiar</button>
        </div>
    </div>
</form>
<hr>
<div class="table-responsive" id="contenedor_liquidacion_de_ingresos" style="display:none;"></div>
