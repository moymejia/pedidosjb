<h4 class="card-title m-b-5 header-titulo">Cartera de clientes</h4>
<form class="margen-formulario" id="formulario_cartera_de_clientes">

    <input type="hidden" id="jsid" name="jsid" value="cartera_de_clientes">

    <div class="row">
        <div class="form-group m-b-5 col-md-3">
            <label for="idvendedor">Vendedor</label>
            <select class="form-control select2" id="idvendedor" name="idvendedor">
                [vendedores_activos]
            </select>
            <span class="bar"></span>
        </div>

        <div class="form-group m-b-5 col-md-3">
            <label for="idcliente">Cliente</label>
            <select class="form-control select2" id="idcliente" name="idcliente">
                [clientes_activos]
            </select>
            <span class="bar"></span>
        </div>

        <div class="form-group m-b-5 col-md-2">
            <label for="fecha_desde">Factura desde</label>
            <input type="date" class="form-control" id="fecha_desde" name="fecha_desde">
            <span class="bar"></span>
        </div>

        <div class="form-group m-b-5 col-md-2">
            <label for="fecha_hasta">Factura hasta</label>
            <input type="date" class="form-control" id="fecha_hasta" name="fecha_hasta">
            <span class="bar"></span>
        </div>

        <div class="form-group col-md-2 m-t-10">
            <br>
            <button
                type="button"
                id="generar_cartera_clientes"
                class="btn btn-success waves-effect waves-light m-r-10"
                onclick="generar_reporte_cartera_de_clientes();"
            >Generar reporte</button>
        </div>
    </div>

    <div class="row">
        <div class="form-group col-md-12">
            <button
                type="reset"
                class="btn btn-inverse waves-effect waves-light m-r-10"
                onclick="limpiar_reporte_cartera_de_clientes();"
            >Limpiar</button>
        </div>
    </div>
</form>
<hr>
<div class="table-responsive" id="contenedor_cartera_de_clientes" style="display:none;"></div>
