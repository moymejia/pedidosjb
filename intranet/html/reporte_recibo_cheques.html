<h4 class="card-title m-b-5 header-titulo">Reporte de recibos</h4>
<form class="margen-formulario" id="formulario_reporte_recibo_cheques">

    <input type="hidden" id="jsid" name="jsid" value="reporte_recibo_cheques">

    <div class="row">
        <div class="form-group m-b-5 col-md-3">
            <label for="idcliente">Cliente</label>
            <select class="form-control select2" id="idcliente" name="idcliente">
                [clientes_activos]
            </select>
            <span class="bar"></span>
        </div>

        <div class="form-group m-b-5 col-md-3">
            <label for="fecha_desde">Fecha cheque desde</label>
            <input type="date" class="form-control" id="fecha_desde" name="fecha_desde" required>
            <span class="bar"></span>
        </div>

        <div class="form-group m-b-5 col-md-3">
            <label for="fecha_hasta">Fecha cheque hasta</label>
            <input type="date" class="form-control" id="fecha_hasta" name="fecha_hasta" required>
            <span class="bar"></span>
        </div>

        <div class="form-group col-md-12 m-t-10">
            <button
                type="button"
                id="generar_reporte_recibo_cheques_btn"
                class="btn btn-success waves-effect waves-light m-r-10"
                onclick="generar_reporte_recibo_cheques();"
            >Generar reporte</button>

            <button
                type="reset"
                class="btn btn-inverse waves-effect waves-light m-r-10"
                onclick="limpiar_reporte_recibo_cheques();"
            >Limpiar</button>
        </div>
    </div>
</form>
<hr>
<div class="table-responsive" id="contenedor_reporte_recibo_cheques" style="display:none;"></div>
